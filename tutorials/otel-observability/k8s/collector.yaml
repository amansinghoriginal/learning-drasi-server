# In-cluster OpenTelemetry Collector. Mock services export here; the Collector
# forwards the stream to Drasi Server on the host. setup-cluster.sh rewrites
# host.k3d.internal to a reachable address when that alias is missing (DinD).
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: default
data:
  relay.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    exporters:
      otlp/drasi:
        endpoint: host.k3d.internal:14317
        tls:
          insecure: true
    processors:
      batch:
        timeout: 1s
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlp/drasi]
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlp/drasi]
        logs:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlp/drasi]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: default
  labels:
    app: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector:0.136.0
          imagePullPolicy: IfNotPresent
          args:
            - --config=/etc/otelcol/relay.yaml
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: 4317
            initialDelaySeconds: 2
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: default
spec:
  selector:
    app: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
